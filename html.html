<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Site Runner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    header {
      padding: 14px;
      background: #1f2937;
    }

    .controls {
      display: flex;
      gap: 10px;
    }

    input, select {
      padding: 12px;
      border: 0;
      border-radius: 6px;
      font-size: 15px;
      background: #374151;
      color: white;
    }

    input {
      flex: 1;
    }

    select {
      cursor: pointer;
      font-weight: bold;
    }

    select:focus, input:focus {
      outline: 2px solid #2563eb;
    }

    input::placeholder {
      color: #9ca3af;
    }

    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #1d4ed8;
    }

    #status {
      margin-top: 10px;
      color: #cbd5e1;
      font-size: 14px;
    }

    #status.error {
      color: #fca5a5;
    }

    .progress-container {
      display: none;
      height: 8px;
      margin-top: 10px;
      overflow: hidden;
      border-radius: 20px;
      background: #374151;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #22c55e;
      transition: width 0.2s ease;
    }

    iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 105px);
      border: 0;
      background: white;
    }

    @media (max-width: 600px) {
      .controls {
        flex-direction: column;
      }

      iframe {
        height: calc(100vh - 210px);
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="controls">
      <input
        id="repoInput"
        type="text"
        placeholder="e.g., https://github.com"
      />

      <select id="modeSelect">
        <option value="main">Production Proxy (main branch)</option>
        <option value="master">Production Proxy (master branch)</option>
      </select>

      <button id="runButton">Run site</button>
    </div>

    <div id="status">
      Enter a public GitHub repository. This environment renders web assets bypasses text/plain restrictions.
    </div>

    <div id="progressContainer" class="progress-container">
      <div id="progressBar" class="progress-bar"></div>
    </div>
  </header>

  <iframe id="siteFrame" src="about:blank"></iframe>

  <script>
    const repoInput = document.getElementById('repoInput');
    const modeSelect = document.getElementById('modeSelect');
    const runButton = document.getElementById('runButton');
    const statusText = document.getElementById('status');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const siteFrame = document.getElementById('siteFrame');

    runButton.addEventListener('click', loadGitHubSite);
    repoInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loadGitHubSite();
    });

    function updateStatus(text, isError = false) {
      statusText.textContent = text;
      if (isError) {
        statusText.classList.add('error');
      } else {
        statusText.classList.remove('error');
      }
    }

    function simulateProgress() {
      progressContainer.style.display = 'block';
      progressBar.style.width = '0%';
      
      let width = 0;
      const interval = setInterval(() => {
        if (width >= 90) {
          clearInterval(interval);
        } else {
          width += Math.random() * 25;
          progressBar.style.width = `${Math.min(width, 95)}%`;
        }
      }, 100);

      return interval;
    }

    function finishProgress(intervalId) {
      clearInterval(intervalId);
      progressBar.style.width = '100%';
      setTimeout(() => {
        progressContainer.style.display = 'none';
      }, 300);
    }

    function loadGitHubSite() {
      let urlValue = repoInput.value.trim();
      if (!urlValue) {
        updateStatus('Please enter a GitHub repository URL.', true);
        return;
      }

      // Strip protocol variations, subdomains, and trailing slashes to extract parts safely
      urlValue = urlValue.replace(/^(https?:\/\/)?(www\.)?github\.com\//i, '');
      const parts = urlValue.split('/').filter(Boolean);

      if (parts.length < 2) {
        updateStatus('Invalid format. Use "username/repository" or the full GitHub URL.', true);
        return;
      }

      const user = parts[0];
      const repo = parts[1];
      const branch = modeSelect.value;
      
      // GitHack handles the right Content-Type headers for rendering raw HTML elements
      const targetUrl = `https://githack.com{user}/${repo}/${branch}/index.html`;
      
      updateStatus(`Loading production proxy environment for ${user}/${repo}...`);
      const progressInterval = simulateProgress();

      // Render asset context safely into the frame container
      siteFrame.src = targetUrl;

      siteFrame.onload = () => {
        finishProgress(progressInterval);
        updateStatus(`Displaying environment via target: ${targetUrl}`);
      };
    }
  </script>
</body>
</html>
